# generic-asic: area ratios derived from the Nangate 45 nm Open Cell Library (X1 drive).
# Values are gate equivalents (GE, NAND2 = 1); see docs/COST_MODEL.md section 1.

[meta]
name = "generic-asic"
description = "Generic standard-cell ASIC, ratios of the Nangate 45 nm Open Cell Library"
source = "NangateOpenCellLibrary_typical (X1 drive)"
nand2_area_um2 = 0.798

[primitives]
INV = 0.67
BUF = 1.0
NAND2 = 1.0
NOR2 = 1.0
NAND3 = 1.33
NOR3 = 1.33
NAND4 = 1.67
NOR4 = 1.67
AND2 = 1.33
OR2 = 1.33
AOI21 = 1.33
OAI21 = 1.33
AOI22 = 1.67
OAI22 = 1.67
AO22 = 2.0
XOR2 = 2.0
XNOR2 = 2.0
MUX2 = 2.33
MUX4 = 4.67
MAJ3 = 2.33
HA = 3.33
FA = 5.33
DLAT = 3.33
DFF = 5.67
DFFR = 6.67
DFFRS = 7.67
EDFF = 7.33
SDFF_ADD = 1.0
ICG = 5.0

# Per-operation coefficients of COST_MODEL.md section 3, in GE. They are part of the
# profile so that scaling a profile scales every cost.
[coefficients]
G = 2.0                  # prefix-adder cell (AO21-like)
sub_extra_per_bit = 0.33 # SUB over ADD, typ architecture
eq_chain_min = 0.55      # per merged input, AND/OR trees
eq_chain_typ = 0.75
eq_max_per_bit = 3.33
eqc_max = 1.33
lt_min = 2.7
lt_typ = 3.5
lt_max = 5.0
ltc_min = 1.0
ltc_typ = 1.33
ltc_max = 2.0
red_and_min = 0.55
red_and_typ = 0.75
red_and_max = 1.33
red_xor_min = 1.67
red_xor_typ = 2.0
red_xor_max = 2.33
mux_min = 1.17           # MUX2-equivalent of a MUX4 cell
pmux_or_min = 0.75
predecode = 1.33
booth_select = 3.5
booth_encode = 6.0
sync_reset_min = 0.67
rom_col = 2.0
rom_lit = 0.75

# Dimensionless factors.
[factors]
add_const_mid = 1.3
add_const_max = 2.0
shift_min = 0.85
priority_typ = 0.9
square = 0.55
cmul_min = 0.7
div_typ = 1.2
div_max = 2.5
logic_scale = 0.85       # typ scale of glue logic (bitwise, reductions)
rom_min = 0.5
macro_min = 0.5
macro_max = 2.0
macro_table_min = 0.9
macro_table_max = 1.1
rms_good = 0.15
rms_medium = 0.25
rms_poor = 0.5

[policy]
timing = "moderate"             # relaxed | moderate | aggressive -> default alpha
enable_style = "mux"            # mux | icg | edff
fsm_encoding = "binary"         # binary | one_hot
icg_min_width = 3
scan = false
resource_sharing = "auto"       # off | auto
datapath_fusion = true
propagate_port_constants = true
sizing_factor = { arith = 1.3, other = 1.15 }
overhead = { typ = 1.0, max = 1.15 }

[alpha]                          # timing -> default alpha
relaxed = 0.0
moderate = 0.4
aggressive = 1.0

[arch]
add = { min = "ripple", mid = "brent_kung", max = "kogge_stone" }
mul = { min = "array", mid = "booth_wallace", max = "wallace_ks", booth_min_width = 2 }

[memory]
macro_enable = true
macro_min_bits = 4096
macro = { c0 = 3000, c_bit = 0.6, c_row = 4, c_col = 30 }
# macro_table = [{ d = 256, w = 32, ge = 9800 }]

[blackbox]
